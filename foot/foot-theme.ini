include=/usr/share/sway/templates/foot.ini

[main]
initial-color-theme=dark

# Catppuccin Mocha, backgrounds flattened to #010101 to match the nvim
# "Catppuccin Mocha Darker" port (~/.config/nvim/lua/plugins/colorscheme.lua).
[colors-dark]
alpha=0.9
foreground=cdd6f4
background=010101
regular0=45475a  # black   (surface1)
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # magenta (pink)
regular6=94e2d5  # cyan    (teal)
regular7=bac2de  # white   (subtext1)
bright0=585b70   # bright black (surface2)
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8   # bright white (subtext0)
16=fab387        # peach
17=f5e0dc        # rosewater
cursor=010101 f5e0dc
selection-foreground=cdd6f4
selection-background=45475a
urls=89b4fa
jump-labels=010101 fab387
search-box-no-match=010101 f38ba8
search-box-match=cdd6f4 313244
