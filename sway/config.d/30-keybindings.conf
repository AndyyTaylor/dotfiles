# Super+Escape locks. Manjaro binds this combo (as code Mod4+9 via --to-code) to stop wf-recorder;
# unbind theirs first so ours doesn't raise an overwrite warning on every reload.
# ~/.local/bin/lockscreen wraps gtklock (GDK_BACKEND, monitor pin, style) and
# turns the fan RGB off while locked.
unbindcode Mod4+9
bindcode Mod4+9 exec /home/andy/.local/bin/lockscreen
bindsym Ctrl+Mod1+l exec /home/andy/.local/bin/lockscreen
