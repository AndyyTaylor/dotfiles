output HDMI-A-1 mode 2560x1440@144.001Hz position 0 0
output DP-2 mode 2560x1440@180Hz position 2560 0

# treat the left monitor as primary: workspace 1 lives there, focus it at startup
workspace 1 output HDMI-A-1
exec swaymsg focus output HDMI-A-1

# plain black desktop background
output * bg #000000 solid_color

# repaint black AFTER the theme's exec_always repaints its generated wallpaper
exec_always sh -c 'sleep 1; swaymsg "output * bg #000000 solid_color"'
