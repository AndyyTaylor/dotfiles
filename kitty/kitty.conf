# terminal on the mac. the sway desktop uses foot; kitty is the mac equivalent,
# so this file is the only thing besides nvim/ that install.sh links there.
#
# the font line is the one that actually matters. linux resolves nvim's devicons
# through the fontconfig monospace -> "JetBrainsMono NF" alias in
# fontconfig/conf.d/51-monospace.conf; macos has no fontconfig, so the family is
# named here instead. without it every icon in the explorer, bufferline and
# dashboard renders as a tofu box.
#
#   brew install --cask font-jetbrains-mono-nerd-font

font_family      JetBrainsMono Nerd Font Mono
# foot uses size=10 against a 1440p linux desktop; macos points are larger, so
# this is the equivalent apparent size on a retina panel rather than the same number.
font_size        13.0

# transcribed from foot/foot-theme.ini [colors-dark], so the sideterm shell and
# claude-agents panes match the pc. nvim's catppuccin colorscheme paints over all
# of this inside the editor -- these only show up in terminal output.
background       #222222
foreground       #eeeeee
background_opacity 0.9

color0  #222222
color1  #cd3f45
color2  #88ad62
color3  #e6cd69
color4  #16a085
color5  #a074c4
color6  #55b5db
color7  #d6d6d6
color8  #41535b
color9  #cd3f45
color10 #88ad62
color11 #e6cd69
color12 #16a085
color13 #a074c4
color14 #55b5db
color15 #ffffff

# matches foot.ini's clipboard-paste binding. cmd+v keeps working regardless.
map ctrl+v paste_from_clipboard
